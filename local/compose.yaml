name: ${COMPOSE_PROJECT_NAME:-paperclip-local}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip
      POSTGRES_DB: paperclip
    volumes:
      - paperclip-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - paperclip-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...';
        sleep 1;
      done;
      mc mb --ignore-existing local/paperclip-uploads;
      echo 'bucket ready';
      "

  litellm:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # Compose network only — do not publish host ports.
    expose:
      - "4000"
    restart: unless-stopped

  paperclip:
    image: ghcr.io/paperclipai/paperclip:sha-e55d702
    env_file:
      - .env
    environment:
      # Provider keys stay on LiteLLM. Paperclip's GEMINI_API_KEY is the gateway master key.
      GEMINI_API_KEY: ${LITELLM_MASTER_KEY}
      ANTHROPIC_API_KEY: ""
      GOOGLE_GEMINI_BASE_URL: http://litellm:4000
      LITELLM_BASE_URL: http://litellm:4000
      GEMINI_CLI_TRUST_WORKSPACE: "true"
      GEMINI_CLI_SYSTEM_SETTINGS_PATH: /etc/gemini-cli/settings.json
    ports:
      - "${PAPERCLIP_HOST_PORT:-3100}:3100"
    volumes:
      - paperclip-home:/paperclip
      - ./gemini-cli/settings.json:/etc/gemini-cli/settings.json:ro
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      litellm:
        condition: service_started
    restart: unless-stopped

volumes:
  paperclip-postgres:
  paperclip-minio:
  paperclip-home:
