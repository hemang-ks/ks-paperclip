# Terraform plan on PRs that touch infrastructure.
# Auth: Workload Identity Federation only — no SA JSON keys.
# Repo variables: GCP_WIF_PROVIDER, GCP_DEPLOYER_SA, GCP_PROJECT_ID, GCP_REGION,
#                 TF_STATE_BUCKET; optional UPLOADS_BUCKET_NAME, PAPERCLIP_PUBLIC_URL

name: terraform-plan

on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/ci-prepare-tfvars.sh"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: infra/terraform/envs/dev

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
      UPLOADS_BUCKET_NAME: ${{ vars.UPLOADS_BUCKET_NAME }}
      PAPERCLIP_PUBLIC_URL: ${{ vars.PAPERCLIP_PUBLIC_URL }}
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: ${{ vars.PAPERCLIP_AUTH_DISABLE_SIGN_UP }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      # Check committed HCL only. ci-prepare-tfvars.sh writes gitignored
      # terraform.tfvars; linting that file fails fmt -check (exit 3).
      - name: terraform fmt -check
        run: terraform fmt -check -recursive ../..

      - name: Prepare tfvars
        working-directory: .
        run: |
          chmod +x scripts/ci-prepare-tfvars.sh
          ./scripts/ci-prepare-tfvars.sh

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -input=false

      - name: terraform validate
        run: terraform validate

      - name: Trivy config (Terraform)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          terraform show -no-color tfplan > plan-full.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = 'infra/terraform/envs/dev/plan.txt';
            let body = fs.readFileSync(path, 'utf8');
            const max = 60000;
            if (body.length > max) {
              body = body.slice(0, max) + '\n\n… truncated …\n';
            }
            const marker = '<!-- terraform-plan-dev -->';
            const header = `${marker}\n### Terraform plan (\`envs/dev\`)\n\n\`\`\`\n`;
            const footer = '\n```\n';
            const comment = header + body + footer;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: Upload plan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-dev
          path: |
            infra/terraform/envs/dev/tfplan
            infra/terraform/envs/dev/plan-full.txt
          if-no-files-found: ignore
