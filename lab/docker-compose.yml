name: ${COMPOSE_PROJECT_NAME:-paperclip-local}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  minio:
    # Docker Hub deleted minio/minio, and quay.io/minio/minio refuses anonymous pulls.
    # pgsty/minio is a drop-in build: same server command, MINIO_* env, and /data layout.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...';
        sleep 1;
      done;
      mc mb --ignore-existing local/paperclip-uploads;
      echo 'bucket ready';
      "

  paperclip:
    image: ghcr.io/paperclipai/paperclip:sha-e55d702
    env_file:
      - .env
    ports:
      - "${PAPERCLIP_HOST_PORT:-3100}:3100"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Deliberately no volume on /paperclip — ephemeral FS for Cloud Run stateless validation.
    restart: unless-stopped
